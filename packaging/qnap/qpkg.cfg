QPKG_NAME="FrameDeck"
QPKG_DISPLAY_NAME="FrameDeck"
QPKG_VER="2.2.2"
QPKG_AUTHOR="souten-yd"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Self-hosted manga and video viewer"
QPKG_ARCH="x86_64"
QPKG_RC_NUM="151"
QPKG_SERVICE_PROGRAM="FrameDeck.sh"
QPKG_WEBUI="/"
QPKG_SERVICE_PORT="9000"
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1178"
QPKG_DESKTOP_APP_WIN_HEIGHT="600"
QPKG_VISIBLE="1"
QPKG_FORCE_VISIBLE="1"
QPKG_DISTRIBUTION_TYPE="1"
QPKG_VOLUME_SELECT="1"
QPKG_TIMEOUT="30,30"
QTS_MINI_VERSION="5.0.0"

# QDK source directories. FrameDeck is intentionally x86_64-only for the
# TS-253Be target; shared contains only the service script while all runtime
# code/binaries live in x86_64.
QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_ICONS="icons"
# Keep QDK's default gzip data archive. Unlike QDK's xz mode, gzip does not
# require an architecture-specific xz_1404_<arch>.tgz helper inside the QPKG.
# This matches the packaging path already proven to install on the target QTS.
QDK_COMPRESS_METHOD="gzip"
