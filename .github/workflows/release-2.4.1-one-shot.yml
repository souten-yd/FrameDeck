name: FrameDeck 2.4.1 release
on:
  push:
    branches:
      - ci/release-2.4.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packaging/qnap/requirements-qnap.txt
            requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run shared tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.4.1-QPKG
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 7
      - name: Publish 2.4.1 release from merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/framedeck-release-notes.md <<'EOF'
          Large library performance for Linux and QNAP TS-253Be:
          - Scan matching files once and commit SQLite listing rows together.
          - Compute comic volume metadata from the same listing and avoid redundant folder scans.
          - Render the browser list once; on QNAP, reveal rows in groups of 300.
          - Keep existing Linux quality settings and QNAP light profile.

          The QPKG is self-contained for TS-253Be (x86_64, QTS 5.0+).
          Local synthetic benchmark: 4,000 files in 0.11 s versus 0.20–0.24 s before; actual NAS performance should be measured on the device.
          EOF
          gh release create v2.4.1 dist/*.qpkg --target e06fe20b30495b88b423ae470e7387dc497c17a6 --title "FrameDeck 2.4.1" --notes-file /tmp/framedeck-release-notes.md
