name: Release FrameDeck 2.4.22

on:
  push:
    branches: [ci/release-2.4.22]
    paths: [.github/workflows/release-2.4.22-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3edc6a874b63d23ab6bfe0f8b5cbbe616964415f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.22', __version__
          assert 'QPKG_VER="2.4.22"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = '3edc6a874b63d23ab6bfe0f8b5cbbe616964415f'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.22
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.22 dist/*.qpkg --target 3edc6a874b63d23ab6bfe0f8b5cbbe616964415f --latest --title "FrameDeck v2.4.22" --notes "正式版。PR #70: QNAP側のLANワーカー登録ボタンを改善。初回にWeb PINが無ければ暗号学的乱数で生成し、HttpOnly SameSiteブラウザ認証、署名付きLAN自動検出を1回の操作で開始。以後は再起動/IP変更後の自動検出とワンタップ再接続が可能。最初のLinuxワーカー鍵だけは管理者がLinux側で一度設定する必要がある（未知のLAN機器を未認証で受け入れないため）。Web PINの設定ファイルは0600、ログイン失敗はメモリ上で回数制限。QNAP本体でSSH操作せずにQNAP側登録が可能。既存のfMP4/HLS/AAC委譲、原版Range、SQLite保護、ffmpeg制限は変更なし。実機LAN/iPad/Ubuntuでの性能測定は未完了。別媒体バックアップ複製PR #69は含まない。"
