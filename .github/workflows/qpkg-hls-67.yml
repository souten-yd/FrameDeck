name: FrameDeck PR67 HLS/QNAP one-shot validation

on:
  push:
    branches: [ci/qpkg-hls-67]
    paths: [.github/workflows/qpkg-hls-67.yml]

permissions:
  contents: read

jobs:
  qnap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cluster-hls-ipad-offload-62
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QDK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify syntax and complete tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: |
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-PR67-QPKG-validation
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
