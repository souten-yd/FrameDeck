name: FrameDeck PR72 secure keyless pairing full validation

on:
  push:
    branches: [ci/verify-keyless-72]
    paths: [.github/workflows/verify-keyless-72.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/no-key-two-sided-pairing-72
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Python syntax JS syntax and cryptographic pairing test
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: |
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          python -m pytest -q -rs tests/test_keyless_pairing.py
      - name: Full FrameDeck regression tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: TS-253Be QPKG build with cryptography wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-PR72-Keyless-QPKG-test
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
