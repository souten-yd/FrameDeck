name: Release FrameDeck 2.4.12

on:
  push:
    branches: [ci/release-2.4.12]
    paths: [.github/workflows/release-2.4.12-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a8e91e36683119b4e1c3a14c311eb9ffb3475ad
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.12
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.12 dist/*.qpkg --target 6a8e91e36683119b4e1c3a14c311eb9ffb3475ad --title "FrameDeck v2.4.12" --notes "同じフォルダ内の続編・外伝を汎用的に識別し、共和国編 01などの巻ラベルを表示します。本編は01のまま、系列ごとに巻順で表示します。カラー版・巻範囲・読書履歴を維持。PR #53。QNAP実機での表示・インストールは未検証です。"
