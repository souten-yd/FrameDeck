name: FrameDeck v2.3.0 one-shot release

# One-shot release workflow. It exists only on ci/qpkg-2.3.0 and is not merged to main.
on:
  push:
    branches:
      - ci/qpkg-2.3.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packaging/qnap/requirements-qnap.txt
            requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt

      - name: Verify release version
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.3.0', __version__
          PY
          grep -q '^QPKG_VER="2.3.0"$' packaging/qnap/qpkg.cfg
          grep -q '^QDK_COMPRESS_METHOD="gzip"$' packaging/qnap/qpkg.cfg
          ! grep -q 'nohup' packaging/qnap/FrameDeck.sh

      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/

      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt

      - name: Build and validate TS-253Be QPKG
        run: |
          bash packaging/qnap/build.sh | tee /tmp/qpkg-build.log
          ! grep -E 'xz_1404_|cannot stat' /tmp/qpkg-build.log
          test -f dist/FrameDeck_2.3.0_TS-253Be_x86_64.qpkg
          sha256sum dist/FrameDeck_2.3.0_TS-253Be_x86_64.qpkg

      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.3.0-QPKG
          path: dist/FrameDeck_2.3.0_TS-253Be_x86_64.qpkg
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.3.0 >/dev/null 2>&1; then
            gh release create v2.3.0 \
              --target f39004425732fac5b501c4f5da4a5cac1b96a7ae \
              --title 'FrameDeck v2.3.0' \
              --notes 'Adaptive comic volume list release. Adds numeric volume ordering independent of normal sort, multi-volume archive recognition, chapter and special-story labels, ZIP/CBZ internal volume detection, automatic fallback to conventional file display, and per-folder Auto/Volume/File display override. Includes the existing QNAP TS-253Be self-contained package and updater support.'
          fi
          gh release upload v2.3.0 dist/FrameDeck_2.3.0_TS-253Be_x86_64.qpkg --clobber
