name: Release FrameDeck 2.4.27

on:
  push:
    branches: [ci/release-2.4.27]
    paths: [.github/workflows/release-2.4.27-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c1a25b433c7dcd5e3d2e234f7dfa1eec41bf94a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.27', __version__
          assert 'QPKG_VER="2.4.27"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = '2c1a25b433c7dcd5e3d2e234f7dfa1eec41bf94a'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.27
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.27 dist/*.qpkg --target 2c1a25b433c7dcd5e3d2e234f7dfa1eec41bf94a --latest --title "FrameDeck v2.4.27" --notes "PR #79: QNAPではLinuxワーカー、Linuxでは親QNAPの名前・URL・版数・状態と共有動画フォルダを表示。動画フォルダの手動マウントなしで、対象動画だけを期限付きの読み取り専用HTTP Range経由でLinuxへ渡してfMP4/HLS変換します。QNAPの画質選択に1080p (ext)を追加し、再生表示にもLinux処理を明記。ワーカー切断時にQNAPで1080p変換を始めない制御を追加。新規の両側承認接続では高速変換を有効化。既存の無効設定と従来のマウント経路は維持。全427テスト・QPKGビルド成功。別プロセスによる実FFmpegのfMP4/1080p HLS、Chromiumでの両側概要・画質表示を確認。自動読み取りにはQNAPとLinuxの両側を更新してください。QNAP実機・iPad/Safariは未確認。"
