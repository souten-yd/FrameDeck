name: Release FrameDeck 2.4.14

on:
  push:
    branches: [ci/release-2.4.14]
    paths: [.github/workflows/release-2.4.14-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 289c459c4217f7f451a46cfc8fb07eb4b486a7d6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.14
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.14 dist/*.qpkg --target 289c459c4217f7f451a46cfc8fb07eb4b486a7d6 --title "FrameDeck v2.4.14" --notes "フォルダの星評価変更時に配下の既読・途中ページ・動画再生位置を引き継ぐ修正です。PR #55を収録。旧版で見えなくなった記録は以前の評価へ戻してフォルダを開き直してください（以前未評価なら星を解除）。親フォルダの評価変更後は読書画面を開き直してください。NAS実機での復旧は未検証です。"
