name: Release FrameDeck 2.4.28

on:
  push:
    branches: [ci/release-2.4.28]
    paths: [.github/workflows/release-2.4.28-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d81e451b0d8b9218eda36d56a6ed30cb23e9e02f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.28', __version__
          assert 'QPKG_VER="2.4.28"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = 'd81e451b0d8b9218eda36d56a6ed30cb23e9e02f'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.28
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.28 dist/*.qpkg --target d81e451b0d8b9218eda36d56a6ed30cb23e9e02f --latest --title "FrameDeck v2.4.28" --notes "正式版。PR #80: メニューバー直下に常時表示されていた親QNAP名・URL・版数・接続状態・動画フォルダ・自動読み取り、およびQNAP側のLinuxワーカー接続概要の表示帯を削除。接続概要は設定画面内に引き続き表示。接続状態の定期取得、Linuxの自動読み取り、fMP4/HLS、1080p (ext)、認証、原版Range配信、ライブラリ・閲覧履歴などの動作は変更なし。PR #81はPythonとQPKGの版数のみ更新。全テストとQNAP TS-253Beパッケージビルドを検証。QNAP/Linux/iPhoneの実機表示は更新後に確認してください。"
