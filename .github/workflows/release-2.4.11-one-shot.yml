name: Release FrameDeck 2.4.11

on:
  push:
    branches: [ci/release-2.4.11]
    paths: [.github/workflows/release-2.4.11-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6be0de9a94f8e5c981a8aca94bdab37ae97e1c7c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.11
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.11 dist/*.qpkg --target 6be0de9a94f8e5c981a8aca94bdab37ae97e1c7c --title "FrameDeck v2.4.11" --notes "動画モードの回線状況・データ節約設定・バッファ切れによる自動画質変更を無効化しました。手動の画質選択とPC・モバイル別の品質設定は維持します。PR #51を収録。実機ブラウザでの動画再生とQNAP実機インストールは未検証です。"
