name: FrameDeck 2.4.20 RC - one-shot QNAP test release
# RC2 validation rerun: preserve two most recent verified SQLite snapshots.

# This file exists ONLY on the isolated RC branch, not on main.
# Only an explicit edit to THIS file triggers a build; ordinary pushes
# and the main CI remain manual-only.
on:
  push:
    branches:
      - release-candidate/framedeck-2.4.20-rc2
    paths:
      - .github/workflows/rc-cluster-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      unit_outcome: ${{ steps.unit.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packaging/qnap/requirements-qnap.txt
            requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Block release on syntax or import errors
        run: |
          python -m compileall -q framedeck
          python -c "import framedeck; from framedeck.web.app import create_app; from framedeck.cluster_discovery import LanDiscovery; print('Server imports OK')"
          node --check framedeck/web/static/js/app.js
      - name: Run full tests (required before RC2 publication)
        id: unit
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Record validation result
        if: always()
        run: |
          echo "## RC unit test outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "Pytest: ${{ steps.unit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hardware-test prerelease, not a stable release." >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.4.20-rc2-QPKG
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 7
      - name: Publish test-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT_OUTCOME: ${{ needs.validate.outputs.unit_outcome }}
        run: |
          gh release create "v2.4.20-rc2" dist/*.qpkg \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FrameDeck 2.4.20-rc2 (QNAP/Linux worker test)" \
            --notes "Test-only prerelease, not stable. Latest stable v2.4.19 is unchanged. Includes opt-in Linux fMP4 offload and LAN discovery with initial secret enrollment; source files remain on QNAP. HLS/iPad offload and metadata synchronization are NOT included. Includes opt-in SQLite 7-daily + 4-weekly backup (defaults OFF; source media NOT backed up). Pytest outcome: $UNIT_OUTCOME. Review Actions logs, back up persistent FrameDeck data, and validate QNAP/Linux/iPad before stable deployment."
