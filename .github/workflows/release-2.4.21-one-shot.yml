name: Release FrameDeck 2.4.21

on:
  push:
    branches: [ci/release-2.4.21]
    paths: [.github/workflows/release-2.4.21-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22584bd9608ed9afb97a17087c25f622edcb5e9e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.21', __version__
          assert 'QPKG_VER="2.4.21"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = '22584bd9608ed9afb97a17087c25f622edcb5e9e'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.21
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.21 dist/*.qpkg --target 22584bd9608ed9afb97a17087c25f622edcb5e9e --latest --title "FrameDeck v2.4.21" --notes "正式版。PR #67: 認証済みLinuxワーカーでiPad向けHLS/fMP4・original-aac音声変換を処理可能にした。QNAPは原本とSQLiteの正本を維持し、ブラウザURL・直接Range配信・Web PINは変更なし。Linux停止時は同じHLS URLからQNAP生成へ復帰し、実測セグメント配信速度が不足するワーカーへの新規割当を一時停止。HLS委譲と自動バックアップは初期OFF。PR #68: バージョン番号整合。QNAP TS-253Beビルドと全回帰テストを実施。実機のNAS/Ubuntu/iPad Safari音声・性能・停止復帰は未測定。NAS外バックアップ複製、revision-basedメタデータ同期、厳密なCPU/encode FPS比較は未実装。"
