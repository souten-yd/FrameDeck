name: FrameDeck 2.4.2 release
on:
  push:
    branches:
      - ci/release-2.4.2
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packaging/qnap/requirements-qnap.txt
            requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run shared tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.4.2-QPKG
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 7
      - name: Publish 2.4.2 release from merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/framedeck-release-notes.md <<'EOF'
          QNAP TS-253Be: Auto streams original video on desktop and mobile, regardless of connection. Only an explicit quality choice enables up to 720p resizing; incompatible codecs fall back to 480p. The QPKG now includes App Center and desktop icons matching the Web app.

          Linux keeps its adaptive video behavior, with 1440p removed and saved 1440p preferences moved to 1080p. Linux self-update from older versions failed with HTTP 415; the source download header is fixed in 2.4.2.

          One-time Linux upgrade: stop FrameDeck, run git status in its checkout, then, if clean, git pull --ff-only origin main and restart FrameDeck. Older updaters cannot fetch this fix themselves. See docs/SELF_UPDATE.md.
          EOF
          gh release create v2.4.2 dist/*.qpkg --target 19eac1856dfb379666acdcf0b275d36858a6db54 --title "FrameDeck 2.4.2" --notes-file /tmp/framedeck-release-notes.md
