name: Release FrameDeck 2.4.7

on:
  push:
    branches: [ci/release-2.4.7]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f1cb27e036cc6b8371fb89f6f655e0f3190452
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.7
          path: dist/*.qpkg
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.7 dist/*.qpkg --target 77f1cb27e036cc6b8371fb89f6f655e0f3190452 --title "FrameDeck v2.4.7" --notes "漫画の連続ページ送りによる要求・先読みの滞留を制限し、一覧再描画と画像寸法確認の負荷を軽減。大きな画像でメモリキャッシュが全消去される問題も修正しました。"
