name: Release FrameDeck 2.4.13

on:
  push:
    branches: [ci/release-2.4.13]
    paths: [.github/workflows/release-2.4.13-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e1d32b4be57536a334c41fbbf674df367b71102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.13
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.13 dist/*.qpkg --target 4e1d32b4be57536a334c41fbbf674df367b71102 --title "FrameDeck v2.4.13" --notes "漫画ビューア右下から2番目のボタンを、左右クリック・タップの進む／戻るを反転するボタンに変更しました。設定は保存され、矢印で進む側を表示します。PR #54を収録。QNAP・Safari実機での確認は未実施です。"
