name: FrameDeck one-shot QPKG 2.4.0

on:
  push:
    branches:
      - ci/qpkg-2.4.0

permissions:
  contents: read

jobs:
  test-and-qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install official QDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate QPKG
        run: bash packaging/qnap/build.sh
      - name: Upload QPKG
        uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.4.0-TS253Be-QPKG
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 7
