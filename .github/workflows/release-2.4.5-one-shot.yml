name: Release FrameDeck 2.4.5

on:
  push:
    branches: [ci/release-2.4.5]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3b2e9a4271644c27f743c52e9da0b9fe1843fd6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.5
          path: dist/*.qpkg
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.5 dist/*.qpkg --target a3b2e9a4271644c27f743c52e9da0b9fe1843fd6 --title "FrameDeck v2.4.5" --notes "漫画一覧に評価優先を追加。星5から1の順に並び、未評価の作品も後ろに表示します。通常順への切替にも対応。"
