name: Release FrameDeck 2.4.4

on:
  push:
    branches: [ci/release-2.4.4]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e4b8481ea333cdb6df7c9a7ccb378b5122d66b0d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.4
          path: dist/*.qpkg
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.4 dist/*.qpkg --target e4b8481ea333cdb6df7c9a7ccb378b5122d66b0d --title "FrameDeck v2.4.4" --notes "QNAP更新後にインストーラーが非ゼロで終了しても、実際に新しい版が起動していれば警告付きの完了として表示します。旧版の保存済みエラー表示も補正します。"
