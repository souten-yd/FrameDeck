name: Release FrameDeck 2.4.24

on:
  push:
    branches: [ci/release-2.4.24]
    paths: [.github/workflows/release-2.4.24-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b2993eba4cc016dc8449212c11dc4319554b9dc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.24', __version__
          assert 'QPKG_VER="2.4.24"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = '3b2993eba4cc016dc8449212c11dc4319554b9dc'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.24
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.24 dist/*.qpkg --target 3b2993eba4cc016dc8449212c11dc4319554b9dc --latest --title "FrameDeck v2.4.24" --notes "正式版。PR #74: LinuxのWebペアリングで暗号化モジュールがないと表示される不具合を修正。v2.4.23でQNAP版のみ同梱されていたcryptography>=43,<47を、LinuxのFrameDeck.py専用venv自動セットアップ対象へ追加。サービスがpython -m framedeckで起動する場合もFrameDeck自身のFrameDeck_venvに限って不足を補い、QNAPの同梱ランタイム・システムPython・他アプリのvenvは変更しない。鍵入力なしでのX25519/HKDF両端Web承認、HMAC認証、QNAP authoritative SQLite、直接Range/iPad HLS/AAC変換は維持。オフライン/インストール失敗時は動画閲覧を続け、ペアリングだけ無効のままとする。PR #75でアプリ・QPKG版数をv2.4.24に更新。全テストとQDK TS-253Be QPKGビルド成功。実機Linuxによる更新・接続は要確認。"
