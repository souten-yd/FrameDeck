name: Release FrameDeck 2.4.9

on:
  push:
    branches: [ci/release-2.4.9]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c5564f466d8bf287356fcd277feb604ba61bc22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.9
          path: dist/*.qpkg
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.9 dist/*.qpkg --target 6c5564f466d8bf287356fcd277feb604ba61bc22 --title "FrameDeck v2.4.9" --notes "別の本を開いた時点で、以前の本の通信・先読み・復旧を中断し、古い応答を破棄します。"
