name: Release FrameDeck 2.4.26

on:
  push:
    branches: [ci/release-2.4.26]
    paths: [.github/workflows/release-2.4.26-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67913fa06ca38bfddbef21027bb3e163502bcba6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and QDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
          ffmpeg -version | head -1
      - name: Install Python test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Verify exact source version and JS syntax
        run: |
          python - <<'PY'
          from framedeck import __version__
          assert __version__ == '2.4.26', __version__
          assert 'QPKG_VER="2.4.26"' in open('packaging/qnap/qpkg.cfg').read()
          PY
          python -m compileall -q framedeck
          node --check framedeck/web/static/js/app.js
          test "$(git rev-parse HEAD)" = '67913fa06ca38bfddbef21027bb3e163502bcba6'
      - name: Run full suite including FFmpeg integration
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q -rs tests/
      - name: Build QNAP TS-253Be x86_64 QPKG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.26
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.26 dist/*.qpkg --target 67913fa06ca38bfddbef21027bb3e163502bcba6 --latest --title "FrameDeck v2.4.26" --notes "PR #78: LANとTailscaleなどのVPNからWeb PINなしで利用可能にしました。RFC1918・IPv6 ULA・100.64.0.0/10間の直接接続、およびTailscale接続元からのMagicDNS完全名に対応します。設定・バックアップ・Linux/QNAPワーカー登録にも適用。公開接続元・任意のDNS名・転送ヘッダー付き接続の拒否とOrigin/cross-site検査、ワーカーHMAC認証を維持します。アプリとQPKGの版数を2.4.26に同期。全420テスト成功。ローカルLinuxのLAN/Tailscale IPでPINなしAPI応答を確認。QNAP・別端末での実接続確認は未実施です。"
