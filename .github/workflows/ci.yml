name: FrameDeck One-shot QPKG Build

# Temporary one-shot build used only to produce the requested QPKG artifact.
# Immediately restored to the normal manual-only workflow after this commit.
on:
  push:
    branches:
      - feat/qnap-qpkg

permissions:
  contents: read

jobs:
  qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git xz-utils libxml2-utils xmlstarlet pv dos2unix
      - name: Build TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.2.0
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
