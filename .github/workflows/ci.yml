name: FrameDeck One-shot QPKG 2.2.2

on:
  push:
    branches:
      - ci/qpkg-2.2.2

permissions:
  contents: write

jobs:
  qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install official QDK 2.5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: |
          bash packaging/qnap/build.sh 2>&1 | tee /tmp/qpkg-build.log
          ! grep -q 'xz_1404_' /tmp/qpkg-build.log
          ! grep -q 'cannot stat' /tmp/qpkg-build.log
          qbuild --query info "$(find dist -maxdepth 1 -type f -name '*.qpkg' -print -quit)"
          sha256sum dist/*.qpkg
      - name: Publish FrameDeck v2.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QPKG="$(find dist -maxdepth 1 -type f -name '*.qpkg' -print -quit)"
          SHA="$(sha256sum "$QPKG" | awk '{print $1}')"
          cat > /tmp/release-notes.md <<EOF
          ## FrameDeck 2.2.2

          ### QNAP data archive compatibility fix
          - Fixes the QTS App Center `data file error` affecting v2.2.1.
          - Uses QDK's gzip data archive path, matching the QNAP package layout already proven on the target NAS.
          - Removes the broken xz packaging path that attempted to reference a missing `xz_1404_<arch>.tgz` helper.
          - Retains official QDK 2.5.3, `qpkg_encrypt`, strict QPKG generation, and post-build `qbuild --query info` validation.
          - Retains pinned SHA-256-verified static FFmpeg/ffprobe.

          Install this v2.2.2 QPKG manually from QTS App Center. Do not use v2.2.0 or v2.2.1.

          QPKG SHA-256: `$SHA`
          EOF
          gh release view v2.2.2 >/dev/null 2>&1 || \
            gh release create v2.2.2 \
              --target 7c84f95da10599b47bedc6a9fe9d0880bba6cee9 \
              --title "FrameDeck v2.2.2 — QNAP data archive fix" \
              --notes-file /tmp/release-notes.md
          gh release upload v2.2.2 "$QPKG" --clobber
