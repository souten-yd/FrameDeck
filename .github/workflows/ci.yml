name: FrameDeck One-shot QPKG 2.2.1 r2

on:
  push:
    branches:
      - ci/qpkg-2.2.1-r2

permissions:
  contents: write

jobs:
  qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install official QDK 2.5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: |
          bash packaging/qnap/build.sh
          sha256sum dist/*.qpkg
      - name: Publish FrameDeck v2.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QPKG="$(find dist -maxdepth 1 -type f -name '*.qpkg' -print -quit)"
          SHA="$(sha256sum "$QPKG" | awk '{print $1}')"
          cat > /tmp/release-notes.md <<EOF
          ## FrameDeck 2.2.1

          ### QNAP QPKG format fix
          - Fixes the QTS App Center \`file format error\` affecting the v2.2.0 QPKG.
          - Uses the complete official QDK 2.5.3 toolchain when cross-building.
          - Requires \`qpkg_encrypt\` so the QPKG tail checksum is written correctly.
          - Builds with \`qbuild --strict --build-arch x86_64\` and validates the finished package with \`qbuild --query info\`.
          - Uses a pinned, SHA-256-verified fully static FFmpeg/ffprobe bundle.

          ### Upgrade note
          The v2.2.0 QNAP package should not be used. Install this v2.2.1 QPKG manually from QTS App Center. After 2.2.1 is installed, future compatible stable releases can be applied from FrameDeck's in-app updater.

          QPKG SHA-256: \`$SHA\`
          EOF
          gh release view v2.2.1 >/dev/null 2>&1 || \
            gh release create v2.2.1 \
              --target 23418036136079251fb5f78d4f83fad45b5b92b5 \
              --title "FrameDeck v2.2.1 — QNAP QPKG format fix" \
              --notes-file /tmp/release-notes.md
          gh release upload v2.2.1 "$QPKG" --clobber
