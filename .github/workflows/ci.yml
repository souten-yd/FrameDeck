name: FrameDeck One-shot 2.2.0 Release

# Temporary release-only workflow. It reuses the already-built QPKG artifact
# and is immediately restored to the normal manual-only workflow.
on:
  push:
    branches:
      - feat/qnap-qpkg

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download existing 2.2.0 QPKG artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9710795060/zip > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Verify QPKG digest
        run: |
          echo 'cbd3d43531b4f87747d9373c42130c6c3fc6fb9fec5f7d895fc281602c8bf073  artifact/FrameDeck_2.2.0_TS-253Be_x86_64.qpkg' | sha256sum -c -
      - name: Publish v2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## FrameDeck 2.2.0

          ### QNAP TS-253Be support
          - Self-contained QPKG for QNAP TS-253Be / Intel J3455 / x86_64 / QTS 5.x.
          - Bundles portable CPython, Python dependencies, ffmpeg/ffprobe, and 7-Zip.
          - Persistent settings, database, cache, and logs remain outside the replaceable QPKG application directory.

          ### In-app updates
          - Adds **Settings → App Update**.
          - Checks the latest stable GitHub Release only when the user explicitly presses the update-check button.
          - Detects QNAP vs Ubuntu/Linux and selects the correct update method.
          - QNAP selects a compatible `.qpkg`, validates the download, installs it, and reconnects after restart.
          - Ubuntu/Linux validates the Release source, keeps a rollback backup, atomically replaces the application code, and restarts.
          - Update apply requests include same-origin protection.

          ### Upgrade note
          FrameDeck 2.1.0 and earlier do not contain the updater, so **2.1.0 → 2.2.0 must be installed manually once**. Future stable releases can then be installed from Settings when a matching QPKG Release asset is available.

          ### QPKG
          `FrameDeck_2.2.0_TS-253Be_x86_64.qpkg`

          SHA-256: `cbd3d43531b4f87747d9373c42130c6c3fc6fb9fec5f7d895fc281602c8bf073`
          EOF
          gh release create v2.2.0 \
            artifact/FrameDeck_2.2.0_TS-253Be_x86_64.qpkg \
            --repo "$GITHUB_REPOSITORY" \
            --target 6bb6727b9b32ec052cc38b8feb66b3c1e7b0aa17 \
            --title 'FrameDeck v2.2.0 — QNAP QPKG & Self Update' \
            --notes-file release-notes.md \
            --latest
