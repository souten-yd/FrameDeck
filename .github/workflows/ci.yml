name: FrameDeck One-shot QPKG 2.2.3

on:
  push:
    branches:
      - ci/qpkg-2.2.3

permissions:
  contents: write

jobs:
  qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate QNAP startup regression fix
        run: |
          set -euo pipefail
          grep -q '__version__ = "2.2.3"' framedeck/__init__.py
          grep -q 'QPKG_VER="2.2.3"' packaging/qnap/qpkg.cfg
          grep -q 'QDK_COMPRESS_METHOD="gzip"' packaging/qnap/qpkg.cfg
          ! grep -q 'nohup' packaging/qnap/FrameDeck.sh
          grep -q '"$PYTHON" -m framedeck' packaging/qnap/FrameDeck.sh

      - name: Install official QDK 2.5.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt

      - name: Build and validate TS-253Be QPKG
        run: |
          set -euo pipefail
          bash packaging/qnap/build.sh 2>&1 | tee /tmp/qpkg-build.log
          ! grep -q 'xz_1404_' /tmp/qpkg-build.log
          ! grep -q 'cannot stat' /tmp/qpkg-build.log
          QPKG="$(find dist -maxdepth 1 -type f -name '*.qpkg' -print -quit)"
          test -n "$QPKG"
          qbuild --query info "$QPKG"
          sha256sum "$QPKG"

      - name: Publish FrameDeck v2.2.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QPKG="$(find dist -maxdepth 1 -type f -name '*.qpkg' -print -quit)"
          SHA="$(sha256sum "$QPKG" | awk '{print $1}')"
          cat > /tmp/release-notes.md <<'EOF'
          ## FrameDeck 2.2.3

          ### QNAP service startup fix
          - Fixes FrameDeck failing to start after a successful QPKG installation on QTS systems without nohup.
          - Starts the bundled Python server directly in the background while retaining persistent stdout/stderr logging and PID tracking.
          - Keeps the QNAP-compatible gzip data archive introduced in v2.2.2.
          - Retains official QDK 2.5.3, qpkg_encrypt, strict QPKG generation, and post-build package validation.

          Install this v2.2.3 QPKG from QTS App Center over v2.2.2.
          EOF
          printf '\nQPKG SHA-256: `%s`\n' "$SHA" >> /tmp/release-notes.md
          gh release view v2.2.3 >/dev/null 2>&1 || \
            gh release create v2.2.3 \
              --target 89c46925d2d08d879b9cf189eabd7841bc63e500 \
              --title "FrameDeck v2.2.3 — QNAP startup fix" \
              --notes-file /tmp/release-notes.md
          gh release upload v2.2.3 "$QPKG" --clobber
