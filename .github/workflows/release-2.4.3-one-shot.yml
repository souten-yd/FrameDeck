name: FrameDeck 2.4.3 release
on:
  push:
    branches:
      - ci/release-2.4.3
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packaging/qnap/requirements-qnap.txt
            requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run shared tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build and validate TS-253Be QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-2.4.3-QPKG
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 7
      - name: Publish 2.4.3 release from merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/framedeck-release-notes.md <<'EOF'
          Returning to a parent folder now places the previously opened child near the middle of the list. Folder history and refresh retain the last scroll position. On QNAP, the list renders a 300-row window around the child with controls to reveal earlier or later entries; Linux retains full-list rendering.

          This release includes the self-contained TS-253Be QPKG. Linux installations on 2.4.1 or earlier still need a one-time manual update because the older updater's HTTP 415 bug cannot retrieve the fixed code; see docs/SELF_UPDATE.md.
          EOF
          gh release create v2.4.3 dist/*.qpkg --target 3f8bdb21391d2ed39fc7a3cc6f217664ca144813 --title "FrameDeck 2.4.3" --notes-file /tmp/framedeck-release-notes.md
