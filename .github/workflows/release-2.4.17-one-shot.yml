name: Release FrameDeck 2.4.17

on:
  push:
    branches: [ci/release-2.4.17]
    paths: [.github/workflows/release-2.4.17-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 204c4fa241d7558cac3ded04899d8f0d289e52a4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r packaging/qnap/requirements-qnap.txt -r requirements-test.txt
      - name: Run tests
        env:
          IMAGEIO_FFMPEG_EXE: /bin/true
        run: python -m pytest -q tests/
      - name: Install QDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils libxml2-utils xmlstarlet pv dos2unix
          curl -fsSL -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          command -v qbuild
          command -v qpkg_encrypt
      - name: Build QPKG
        run: bash packaging/qnap/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDeck-QPKG-2.4.17
          path: dist/*.qpkg
          if-no-files-found: error
          retention-days: 3
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.17 dist/*.qpkg --target 204c4fa241d7558cac3ded04899d8f0d289e52a4 --title "FrameDeck v2.4.17" --notes "ページ送りごとの不要なフォルダ情報のDB書き込みを削減し、評価の上書きも防止しました。必要な先読みの中断・再要求を抑え、停止した先読みは12秒で打ち切って後続へ進めます。PR #59を収録。キャッシュ識別・メモリ保持・読書位置のまとめ保存は維持します。更新後はブラウザを再読み込みしてください。QNAP・iOS実機でのタイムアウト解消は未確認です。"
